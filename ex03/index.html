<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <title>Colors and Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Colors & Opacity</h1>

    <div class="named-color">
        Named Color
    </div>

    <div class="hex-color">
        HEX Color
    </div>

    <div class="rgb-color">
        RGB Color
    </div>

    <div class="rgba-color">
        RGBA Color
    </div>

    <h2>Opacity vs RGBA</h2>

    <div class="opacity-box">
        <p>This text is affected by opacity.</p>
    </div>

    <div class="rgba-box">
        <p>This text is not affected by background transparency.</p>
    </div>

</body>
</html>
